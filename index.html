<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Ball Battle System</title>
<style>
:root{--bg:#0a0e14;--panel:#151b24;--line:#2b3644;--red:#ff4d4d;--green:#2ecc71;--yel:#ffd21f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{margin:0;background:var(--bg);color:#e8eef5;font-family:system-ui,-apple-system,sans-serif;
     min-height:100vh;display:flex;flex-direction:column}
.hide{display:none!important}
button{font:inherit;font-weight:800;border:2px solid var(--line);background:var(--panel);
       color:#e8eef5;border-radius:14px;cursor:pointer}
button:active{transform:scale(.97)}
#pick{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px}
#pick h1{font-size:16px;letter-spacing:.2em;color:#8a97a6;text-transform:uppercase;margin:0 0 8px}
#pick button{width:100%;max-width:320px;padding:22px;font-size:19px}
#pick .r{border-color:var(--red);color:var(--red)}
#pick .g{border-color:var(--green);color:var(--green)}
#clicker{flex:1;display:none;flex-direction:column;padding:14px;gap:12px}
.hdr{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#8a97a6;letter-spacing:.1em}
.big{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
     border-radius:24px;border:3px solid;font-size:clamp(70px,26vw,160px);font-weight:900;
     font-variant-numeric:tabular-nums;line-height:1}
.big small{font-size:13px;letter-spacing:.16em;font-weight:700;opacity:.65;margin-top:10px;text-align:center}
.big.off{opacity:.3}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row button{padding:18px;font-size:16px}
#yellowBtn{padding:20px;font-size:17px;border-color:var(--yel);color:var(--yel);background:#2e2500}
#yellowBtn.taken{opacity:.3}
#minus{background:#241418;border-color:#5a2a30}
#display{flex:1;display:none;flex-direction:column;padding:18px;gap:14px;text-align:center}
#clock{font-size:clamp(56px,16vw,120px);font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
#clock.warn{color:var(--yel)} #clock.crit{color:var(--red);animation:p .6s infinite alternate}
@keyframes p{to{opacity:.4}}
.scores{display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:1}
.sc{border:3px solid;border-radius:20px;padding:18px;display:flex;flex-direction:column;justify-content:center}
.sc .nm{font-size:15px;letter-spacing:.15em;font-weight:800}
.sc .pts{font-size:clamp(56px,17vw,120px);font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.sc .det{font-size:14px;color:#8a97a6;margin-top:6px}
.sc .yb{color:var(--yel);font-size:14px;font-weight:800;margin-top:4px;min-height:18px}
.dctl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.dctl button{padding:14px 22px;font-size:15px}
#startBtn{background:#12602f;border-color:#1d8a45}
#winner{font-size:20px;font-weight:900;letter-spacing:.08em;min-height:26px}
.red{border-color:var(--red)!important;color:var(--red)}
.green{border-color:var(--green)!important;color:var(--green)}
#conn{font-size:11px;color:#5c6875;letter-spacing:.08em;text-align:center}
</style>
</head>
<body>

<div id="pick">
  <h1>Select this device's role</h1>
  <button onclick="setRole('display')">📺 DISPLAY / REFEREE</button>
  <button class="r" onclick="setRole('red')">🔴 TEAM RED CLICKER</button>
  <button class="g" onclick="setRole('green')">🟢 TEAM GREEN CLICKER</button>
  <div id="conn">Open this same page on all 3 devices.<br>Start the match from the Display device.</div>
</div>

<div id="clicker">
  <div class="hdr"><span id="cName"></span><span id="cTime">2:00</span></div>
  <div class="big off" id="cBig"><span id="cCount">0</span><small id="cLeft">TAP = 2 BALLS</small></div>
  <button id="yellowBtn">⭐ YELLOW BALL — 3 PTS</button>
  <div class="row">
    <button id="minus">− Undo (−2)</button>
    <button onclick="location.reload()">Change role</button>
  </div>
</div>

<div id="display">
  <div class="hdr" style="justify-content:center">BALL BATTLE · 2:00 MATCH</div>
  <div id="clock">2:00</div>
  <div id="winner"></div>
  <div class="scores">
    <div class="sc red"><div class="nm">TEAM RED</div><div class="pts" id="rPts">0</div>
      <div class="det" id="rDet">0/30 balls</div><div class="yb" id="rYb"></div></div>
    <div class="sc green"><div class="nm">TEAM GREEN</div><div class="pts" id="gPts">0</div>
      <div class="det" id="gDet">0/30 balls</div><div class="yb" id="gYb"></div></div>
  </div>
  <div class="dctl">
    <button id="startBtn">Start</button>
    <button id="resetBtn">Reset Match</button>
    <button onclick="location.reload()">Change role</button>
  </div>
</div>

<script>
const KEY='ballbattle:v2', DUR=120, MAX=30, STEP=2;
let role=null, S=fresh(), busy=false;

function fresh(){return {red:{b:0,y:false},green:{b:0,y:false},end:0,running:false,left:DUR};}

async function pull(){
  try{
    const r = await window.storage.get(KEY,true);
    if(r && r.value) S = JSON.parse(r.value);
  }catch(e){ /* key missing on first run — keep local */ }
  return S;
}
async function push(){
  try{ await window.storage.set(KEY, JSON.stringify(S), true); }catch(e){}
  paint();
}

function secsLeft(){
  if(S.running) return Math.max(0, Math.ceil((S.end - Date.now())/1000));
  return Math.max(0, S.left);
}
const pts = t => S[t].b + (S[t].y ? 3 : 0);
const mmss = s => Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const live = () => S.running && secsLeft() > 0;

function beep(f,d){try{const c=new(window.AudioContext||webkitAudioContext)();
const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);
o.type='square';o.frequency.value=f;g.gain.value=.12;o.start();o.stop(c.currentTime+d);}catch(e){}}

function paint(){
  const t = secsLeft();
  if(role==='display'){
    const c=document.getElementById('clock');
    c.textContent = mmss(t);
    c.className = t<=10 ? 'crit' : t<=30 ? 'warn' : '';
    document.getElementById('startBtn').textContent = S.running ? 'Pause' : (t<=0 ? 'Finished' : 'Start');
    for(const [k,p] of [['red','r'],['green','g']]){
      document.getElementById(p+'Pts').textContent = pts(k);
      document.getElementById(p+'Det').textContent = S[k].b+'/'+MAX+' balls';
      document.getElementById(p+'Yb').textContent  = S[k].y ? '⭐ YELLOW BALL +3' : '';
    }
    const w=document.getElementById('winner');
    if(t<=0){
      const r=pts('red'), g=pts('green');
      w.textContent = r===g ? 'DRAW' : (r>g ? '🔴 RED WINS' : '🟢 GREEN WINS');
      w.className = r===g ? '' : (r>g ? 'red' : 'green');
    } else w.textContent = S.running ? '' : 'READY';
  } else if(role){
    document.getElementById('cTime').textContent = mmss(t);
    document.getElementById('cCount').textContent = pts(role);
    const rem = MAX - S[role].b;
    document.getElementById('cLeft').textContent =
      live() ? (rem+' BALLS LEFT · TAP = 2') : (t<=0 ? 'MATCH OVER' : 'WAITING FOR START');
    document.getElementById('cBig').classList.toggle('off', !live());
    document.getElementById('yellowBtn').classList.toggle('taken', S.red.y || S.green.y || !live());
  }
}

async function act(fn){
  if(busy) return; busy=true;
  await pull();
  const ok = fn();
  if(ok) await push(); else paint();
  busy=false;
}

const score = d => act(()=>{
  if(!live()) return false;
  const n = S[role].b + d*STEP;
  if(n<0 || n>MAX) return false;
  S[role].b = n; beep(d>0?900:400,.06); return true;
});

const yellow = () => act(()=>{
  if(!live() || S.red.y || S.green.y) return false;
  S[role].y = true; beep(1400,.25); return true;
});

const toggle = () => act(()=>{
  if(S.running){ S.left = secsLeft(); S.running = false; }
  else{
    if(S.left <= 0) return false;
    S.end = Date.now() + S.left*1000;
    S.running = true;
    beep(1000,.15);
  }
  return true;
});

const reset = () => act(()=>{ S = fresh(); return true; });

async function setRole(r){
  role = r;
  document.getElementById('pick').classList.add('hide');
  if(r==='display'){
    document.getElementById('display').style.display='flex';
    document.getElementById('startBtn').onclick = toggle;
    document.getElementById('resetBtn').onclick = reset;
  }else{
    document.getElementById('clicker').style.display='flex';
    document.getElementById('cName').textContent = 'TEAM '+r.toUpperCase();
    const col = r==='red' ? '#ff4d4d' : '#2ecc71';
    const b = document.getElementById('cBig');
    b.style.borderColor = col; b.style.color = col;
    b.onclick = () => score(1);
    document.getElementById('minus').onclick = () => score(-1);
    document.getElementById('yellowBtn').onclick = yellow;
  }
  await pull();
  if(role==='display' && !S.running && S.left===DUR && S.end===0) await push();
  paint();

  setInterval(async ()=>{
    if(busy) return;
    await pull();
    if(S.running && secsLeft() <= 0){
      S.running = false; S.left = 0;
      if(role==='display') await push();
      beep(200,.8);
    }
    paint();
  }, 600);

  setInterval(()=>{ if(S.running) paint(); }, 250);
}
</script>
</body>
</html>
