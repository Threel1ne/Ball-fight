<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Ball Battle Scoreboard</title>
<style>
:root{--bg:#0a0e14;--panel:#151b24;--line:#2b3644;--red:#ff4d4d;--green:#2ecc71;--yel:#ffd21f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{margin:0;background:var(--bg);color:#e8eef5;font-family:system-ui,-apple-system,sans-serif;
     min-height:100vh;display:flex;flex-direction:column;padding:16px;gap:12px}
.hide{display:none!important}
button{font:inherit;font-weight:800;border:2px solid var(--line);background:var(--panel);
       color:#e8eef5;border-radius:14px;cursor:pointer}
button:active{transform:scale(.97)}
button:disabled{opacity:.28;cursor:default}
button:disabled:active{transform:none}

h1{font-size:12px;letter-spacing:.22em;color:#8a97a6;text-transform:uppercase;margin:0;text-align:center}
#clock{font-size:clamp(50px,14vw,110px);font-weight:900;font-variant-numeric:tabular-nums;
       line-height:1;text-align:center}
#clock.warn{color:var(--yel)}
#clock.crit{color:var(--red);animation:p .6s infinite alternate}
@keyframes p{to{opacity:.4}}
#phase{font-size:18px;font-weight:900;letter-spacing:.08em;min-height:24px;text-align:center}

.scores{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1;min-height:180px}
.sc{border:3px solid;border-radius:20px;padding:14px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center}
.sc.red{border-color:var(--red)} .sc.green{border-color:var(--green)}
.sc .nm{font-size:14px;letter-spacing:.15em;font-weight:800}
.sc.red .nm{color:var(--red)} .sc.green .nm{color:var(--green)}
.sc .pts{font-size:clamp(52px,16vw,120px);font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.sc .det{font-size:13px;color:#8a97a6;margin-top:4px}
.sc .yb{color:var(--yel);font-size:13px;font-weight:800;min-height:17px}
.sc .adj{font-size:12px;color:#8a97a6;min-height:15px}

.panel{border-radius:18px;padding:12px;background:#101720;border:2px solid var(--line)}
.panel.refmode{border-style:dashed;border-color:#7a6a2a;background:#191506}
.panel h3{margin:0 0 10px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;
          color:#8a97a6;text-align:center}
.panel.refmode h3{color:var(--yel)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.col{display:flex;flex-direction:column;gap:6px}
.col .lbl{font-size:12px;font-weight:800;letter-spacing:.1em;text-align:center}
.pm{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pm button{padding:16px 0;font-size:19px}
.ybtn{padding:11px 0;font-size:13px;border-color:var(--yel);color:var(--yel);background:#2e2500}
.ybtn.on{background:var(--yel);color:#1a1400;border-color:var(--yel)}

.ctrl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.ctrl button{padding:14px 22px;font-size:15px}
#startBtn{background:#12602f;border-color:#1d8a45}
#lockBtn{width:100%;margin-top:10px;padding:14px;font-size:15px;background:#1d3a5c;border-color:#2f6fa8}
.red{color:var(--red)} .green{color:var(--green)}
</style>
</head>
<body>

<h1>Ball Battle · 2:00 Match</h1>
<div id="clock">2:00</div>
<div id="phase">READY</div>

<div class="scores">
  <div class="sc red">
    <div class="nm">TEAM RED</div>
    <div class="pts" id="rPts">0</div>
    <div class="det" id="rDet">0/30 balls</div>
    <div class="yb" id="rYb"></div>
    <div class="adj" id="rAdj"></div>
  </div>
  <div class="sc green">
    <div class="nm">TEAM GREEN</div>
    <div class="pts" id="gPts">0</div>
    <div class="det" id="gDet">0/30 balls</div>
    <div class="yb" id="gYb"></div>
    <div class="adj" id="gAdj"></div>
  </div>
</div>

<!-- LIVE counting panel: only during a running match -->
<div class="panel hide" id="livePanel">
  <h3>Live Count</h3>
  <div class="grid">
    <div class="col">
      <div class="lbl red">RED</div>
      <div class="pm">
        <button onclick="ball('red',-1)">−1</button>
        <button onclick="ball('red',1)">+1</button>
      </div>
      <button class="ybtn" id="ryLive" onclick="yellow('red')">⭐ Yellow +3</button>
    </div>
    <div class="col">
      <div class="lbl green">GREEN</div>
      <div class="pm">
        <button onclick="ball('green',-1)">−1</button>
        <button onclick="ball('green',1)">+1</button>
      </div>
      <button class="ybtn" id="gyLive" onclick="yellow('green')">⭐ Yellow +3</button>
    </div>
  </div>
</div>

<!-- REFEREE panel: only after time hits 0:00 -->
<div class="panel refmode hide" id="refPanel">
  <h3>⚖ Referee — Final Count</h3>
  <div class="grid">
    <div class="col">
      <div class="lbl red">RED</div>
      <div class="pm">
        <button onclick="adj('red',-1)">−1</button>
        <button onclick="adj('red',1)">+1</button>
      </div>
      <button class="ybtn" id="ryRef" onclick="yellow('red')">⭐ Yellow +3</button>
    </div>
    <div class="col">
      <div class="lbl green">GREEN</div>
      <div class="pm">
        <button onclick="adj('green',-1)">−1</button>
        <button onclick="adj('green',1)">+1</button>
      </div>
      <button class="ybtn" id="gyRef" onclick="yellow('green')">⭐ Yellow +3</button>
    </div>
  </div>
  <button id="lockBtn" onclick="lockIn()">✔ Confirm Final Score</button>
</div>

<div class="ctrl">
  <button id="startBtn" onclick="toggle()">Start</button>
  <button onclick="reset()">Reset Match</button>
</div>

<script>
const DUR = 120, MAX = 30, YELLOW = 3;

// phase: 'ready' -> 'running' (or 'paused') -> 'review' -> 'final'
let phase = 'ready';
let left  = DUR;
let endAt = 0;
let T = { red:{b:0,y:false,adj:0}, green:{b:0,y:false,adj:0} };
let ticker = null;

const pts  = t => T[t].b + (T[t].y ? YELLOW : 0) + T[t].adj;
const mmss = s => Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');

function secsLeft(){
  if(phase === 'running') return Math.max(0, Math.ceil((endAt - Date.now())/1000));
  return Math.max(0, left);
}

function beep(f,d){try{const c=new(window.AudioContext||webkitAudioContext)();
const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);
o.type='square';o.frequency.value=f;g.gain.value=.12;o.start();o.stop(c.currentTime+d);}catch(e){}}

function paint(){
  const t = secsLeft();
  const clk = document.getElementById('clock');
  clk.textContent = mmss(t);
  clk.className = (phase==='running' && t<=10) ? 'crit'
                : (phase==='running' && t<=30) ? 'warn' : '';

  for(const [k,p] of [['red','r'],['green','g']]){
    document.getElementById(p+'Pts').textContent = pts(k);
    document.getElementById(p+'Det').textContent = T[k].b + '/' + MAX + ' balls';
    document.getElementById(p+'Yb').textContent  = T[k].y ? '⭐ YELLOW +' + YELLOW : '';
    document.getElementById(p+'Adj').textContent = T[k].adj ? (T[k].adj>0 ? 'ref +'+T[k].adj : 'ref '+T[k].adj) : '';
  }

  // panels are driven purely by phase — no panel before the match ends
  document.getElementById('livePanel').classList.toggle('hide', !(phase==='running' || phase==='paused'));
  document.getElementById('refPanel').classList.toggle('hide',  phase !== 'review');

  for(const id of ['ryLive','ryRef']) { const e=document.getElementById(id); if(e) e.classList.toggle('on', T.red.y); }
  for(const id of ['gyLive','gyRef']) { const e=document.getElementById(id); if(e) e.classList.toggle('on', T.green.y); }

  const btn = document.getElementById('startBtn');
  btn.textContent = phase==='running' ? 'Pause' : phase==='paused' ? 'Resume' : 'Start';
  btn.disabled = (phase==='review' || phase==='final');

  const ph = document.getElementById('phase');
  const r = pts('red'), g = pts('green');
  const res = r===g ? 'DRAW' : (r>g ? '🔴 RED WINS' : '🟢 GREEN WINS');
  if(phase==='ready')        { ph.textContent = 'READY';               ph.className=''; }
  else if(phase==='running') { ph.textContent = 'FIGHT!';              ph.className=''; }
  else if(phase==='paused')  { ph.textContent = 'PAUSED';              ph.className=''; }
  else if(phase==='review')  { ph.textContent = 'TIME UP · REFEREE COUNT'; ph.className=''; }
  else                       { ph.textContent = 'FINAL — ' + res;
                               ph.className = r===g ? '' : (r>g ? 'red' : 'green'); }
}

function toggle(){
  if(phase==='running'){
    left = secsLeft(); phase='paused'; clearInterval(ticker); ticker=null;
  } else if(phase==='ready' || phase==='paused'){
    if(left <= 0) return;
    endAt = Date.now() + left*1000;
    phase = 'running';
    beep(1000,.15);
    ticker = setInterval(()=>{
      const t = secsLeft();
      if(t <= 0){
        clearInterval(ticker); ticker=null;
        left = 0; phase = 'review';       // time up -> referee panel appears HERE
        beep(200,.9);
      }
      paint();
    }, 200);
  }
  paint();
}

// live counting — only while the match is actually running
function ball(team, d){
  if(phase !== 'running' && phase !== 'paused') return;
  const n = T[team].b + d;
  if(n < 0 || n > MAX) return;
  T[team].b = n;
  beep(d>0 ? 900 : 400, .06);
  paint();
}

// yellow ball — one team only, works live and in review
function yellow(team){
  if(phase !== 'running' && phase !== 'paused' && phase !== 'review') return;
  const other = team==='red' ? 'green' : 'red';
  if(T[team].y){ T[team].y = false; }
  else { T[team].y = true; T[other].y = false; }
  beep(1400,.2);
  paint();
}

// referee correction — only after time up, before lock
function adj(team, d){
  if(phase !== 'review') return;
  if(pts(team) + d < 0) return;
  T[team].adj += d;
  beep(d>0 ? 820 : 420, .06);
  paint();
}

function lockIn(){
  if(phase !== 'review') return;
  phase = 'final';
  beep(1200,.5);
  paint();
}

function reset(){
  clearInterval(ticker); ticker = null;
  phase = 'ready'; left = DUR; endAt = 0;
  T = { red:{b:0,y:false,adj:0}, green:{b:0,y:false,adj:0} };
  paint();
}

paint();
</script>
</body>
</html>
